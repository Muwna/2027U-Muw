<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>劇本板</title>
    <script>
      // 白底／黑底的約定（spec〈入口頁〉，docs/superpowers/specs/2026-11-04-portal-and-editor-polish-design.md）：
      // localStorage 鍵 portal-theme，值只有 light／dark，其他值當作沒有；沒有就跟著 prefers-color-scheme；
      // 套在 <html data-theme>。這裡在 React 載入前先套好，免得閃一下錯的底色。
      // 同一個約定另一份在 src/app/theme.ts（入口頁也各有一份），改這裡就要一起改。
      ;(function () {
        var theme = null
        try {
          theme = window.localStorage.getItem('portal-theme')
        } catch (e) {
          theme = null
        }
        if (theme !== 'light' && theme !== 'dark') {
          var dark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches
          theme = dark ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-DQ-_CuHs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D7Eow5oJ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
